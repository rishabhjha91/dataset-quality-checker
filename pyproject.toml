[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-quality-checker"
version = "0.1.0"
description = "Dependency-free quality checks for tabular datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Repository Maintainer"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
